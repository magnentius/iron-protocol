<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0e13">
<meta name="description" content="Mobile battle tracker for Iron Protocol — energy, Armor DR, criticals and countermeasures.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Protocol">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
<title>Iron Protocol — Battle Tracker</title>
</head>
<body>

<header class="appbar">
  <div>
    <div class="round" id="round-label">Round 1</div>
    <div class="phase" id="phase-label">Energy Phase</div>
  </div>
  <div class="spacer"></div>
  <button class="sync-pill" id="sync-pill" type="button">
    <span class="dot"></span><span id="sync-text">Local</span>
  </button>
</header>

<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button type="button" data-tab="battle" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4.5v9L12 22l-8-6.5v-9L12 2z"/></svg>
    Battle
  </button>
  <button type="button" data-tab="attack" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    Attack
  </button>
  <button type="button" data-tab="frames" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>
    Frames
  </button>
  <button type="button" data-tab="reference" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2z"/><path d="M9 7h7M9 11h7"/></svg>
    Ref
  </button>
</nav>

<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
