name: Release

# Cut a release by tagging:
#
#   git tag v2026.08.13 && git push origin v2026.08.13
#
# Date-based on purpose. A player holds a printed sheet, and "2026-08-13" tells
# them how current it is at a glance; "v1.4.0" does not. A second release on the
# same day takes a serial — v2026.08.13.2 — which is the shape sw.js already uses.
#
# Everything in a release carries the same edition date, including sheets that
# did not change, so a player comparing a sheet against the rulebook can see at
# once that they are from the same set.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write   # to create the release and upload assets

env:
  TYPST_VERSION: '0.15.1'

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Typst ${{ env.TYPST_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSL "$url" -o typst.tar.xz
          tar -xJf typst.tar.xz
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      # v2026.08.13 -> 2026-08-13, v2026.08.13.2 -> 2026-08-13.2
      - name: Derive the edition date from the tag
        id: edition
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          edition="$(echo "${tag#v}" | sed -E 's/^([0-9]{4})\.([0-9]{2})\.([0-9]{2})/\1-\2-\3/')"
          echo "tag=$tag"          >> "$GITHUB_OUTPUT"
          echo "edition=$edition"  >> "$GITHUB_OUTPUT"
          echo "Building edition $edition from tag $tag"

      - name: Build the rulebook and every sheet
        run: |
          set -euo pipefail
          mkdir -p dist
          ed="${{ steps.edition.outputs.edition }}"
          # Flags spelled out rather than carried in a variable: an unquoted
          # expansion only splits into separate arguments under bash's rules,
          # and a build that depends on the shell's word-splitting is a build
          # that breaks the first time someone runs the step somewhere else.
          typst compile --root . --font-path typst/fonts --ignore-system-fonts \
            --input "edition=$ed" typst/rules.typ \
            "dist/iron-protocol-rulebook-$ed.pdf"
          for src in typst/frames/*.typ; do
            name="$(basename "$src" .typ)"
            typst compile --root . --font-path typst/fonts --ignore-system-fonts \
              --input "edition=$ed" "$src" "dist/${name}.pdf"
          done
          ls -la dist

      - name: Every sheet must still fit on one page
        run: |
          set -euo pipefail
          mkdir -p .pagecheck
          fail=0
          for src in typst/frames/*.typ; do
            name="$(basename "$src" .typ)"
            typst compile --root . --font-path typst/fonts --ignore-system-fonts \
              --format png --ppi 40 "$src" ".pagecheck/${name}-{p}.png"
            pages="$(find .pagecheck -name "${name}-*.png" | wc -l | tr -d ' ')"
            [ "$pages" -eq 1 ] || { echo "::error::${name} renders ${pages} pages"; fail=1; }
          done
          exit "$fail"

      # One archive of the five sheets, because that is how they are used: you
      # print the set, not one frame.
      - name: Bundle the sheets
        run: |
          set -euo pipefail
          ed="${{ steps.edition.outputs.edition }}"
          zip -j -q "dist/iron-protocol-record-sheets-$ed.zip" dist/if_*.pdf

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ed='${{ steps.edition.outputs.edition }}'
          gh release create "${{ steps.edition.outputs.tag }}" \
            --title "Iron Protocol — $ed" \
            --notes-file .github/release-notes.md \
            "dist/iron-protocol-rulebook-$ed.pdf" \
            "dist/iron-protocol-record-sheets-$ed.zip" \
            dist/if_*.pdf
