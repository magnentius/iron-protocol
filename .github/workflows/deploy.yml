name: Deploy tracker

# Deploys the Battle Tracker to Firebase Hosting, with the database rules.
#
# Kept separate from Release on purpose. The app and the rulebook change at
# different rates — a rules erratum should not redeploy the app, and a CSS fix
# should not cut a rules release — they fail in different ways, and only this
# one needs a credential.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'www/**'
      - 'firebase.json'
      - 'firebase.rules.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tracker
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, stamp and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe needs the tags

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Nothing deploys over a failing suite. This is also the first time the
      # tests have gated anything.
      - name: Run the rules engine tests
        run: node tools/run-tests.mjs

      # Resolved once, before anything touches the tree. Deriving it a second
      # time later would read a working copy the stamp step has already
      # modified, and --dirty would then disagree with what was stamped.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      # The service worker's VERSION is a cache key: if it does not change when
      # the code does, every client keeps serving the previous build from an
      # unchanged key, and no later deploy can dislodge it. It has been bumped
      # by hand until now, which is a manual step with a silent failure mode.
      # git describe changes on every commit, so it cannot be forgotten.
      - name: Stamp the service worker
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          echo "Stamping sw.js VERSION = $version"
          perl -pi -e "s/^const VERSION = '.*';/const VERSION = '${version}';/" docs/sw.js
          grep -n "^const VERSION" docs/sw.js

      - name: Authenticate to Firebase
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set — see .github/workflows/deploy.yml"
            exit 1
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      - name: Deploy hosting and database rules
        run: |
          set -euo pipefail
          npm install -g firebase-tools@13
          firebase deploy --only hosting:tracker,database --project iron-protocol-406da --non-interactive

      # The landing page is a separate Hosting target, so a tracker change never
      # republishes it and vice versa. Both live in this workflow because they
      # share the one credential.
      - name: Deploy the landing page
        run: |
          set -euo pipefail
          firebase deploy --only hosting:site --project iron-protocol-406da --non-interactive

      # A green deploy step is not proof the right bytes are being served, but
      # neither is a single check the instant it finishes: Firebase reports
      # "release complete" before the edges have caught up, so a check that runs
      # immediately reads the previous build and fails a deploy that worked.
      # Poll instead, and only give up after the propagation window.
      - name: Verify what is live
        run: |
          set -euo pipefail
          expected="${{ steps.version.outputs.version }}"
          hosts="iron-protocol-406da.web.app play.ironproto.app"
          for host in $hosts; do
            ok=0
            for attempt in $(seq 1 20); do
              live="$(curl -fsSL -H 'Cache-Control: no-cache' "https://$host/sw.js" \
                       | sed -n "s/^const VERSION = '\(.*\)';/\1/p" || true)"
              if [ "$live" = "$expected" ]; then
                echo "$host serving $live (attempt $attempt)"
                ok=1
                break
              fi
              echo "  $host still on '${live:-?}', waiting for $expected ($attempt/20)"
              sleep 6
            done
            [ "$ok" -eq 1 ] || {
              echo "::error::$host never served '$expected' within 2 minutes"
              exit 1
            }
          done
          echo "Both hosts are serving $expected"
